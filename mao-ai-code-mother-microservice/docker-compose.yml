# 一键启动后端依赖的基础设施：MySQL、Redis、Nacos（Dubbo 注册中心）
# 使用：在 docker-compose.yml 所在目录执行  docker compose up -d
#
# 各微服务（user/app/gateway/screenshot）在宿主机（非容器内）直接运行，
# 通过 localhost 访问下面映射出来的端口。

services:
  mysql:
    image: mysql:8.0
    container_name: yu-ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: yu_ai_code_mother
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: yu-ai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: yu-ai-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      NACOS_AUTH_TOKEN: SecretKey0123456789abcdefghijklmnopqrstuvwxyz
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/health/check"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ===== Milvus 向量数据库（standalone）=====
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: yu-ai-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: yu-ai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: yu-ai-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  attu:
    image: zilliz/attu:v2.4.13
    container_name: yu-ai-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "18080:3000"
    depends_on:
      - milvus
    restart: unless-stopped

volumes:
  mysql-data:
  etcd-data:
  minio-data:
