apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-data
  namespace: yu-ai-code
  labels:
    app: nacos
    app.kubernetes.io/part-of: mao-ai-code-mother
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: yu-ai-code
  labels:
    app: nacos
    app.kubernetes.io/part-of: mao-ai-code-mother
spec:
  replicas: 1
  # 单实例 + 独占 PVC（ReadWriteOnce），必须 Recreate，否则滚动更新会有第二个 Pod 抢挂载失败
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.3.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8848
            - name: grpc
              containerPort: 9848
            - name: grpc2
              containerPort: 9849
          env:
            - name: MODE
              value: "standalone"
            - name: PREFER_HOST_MODE
              value: "hostname"
            # standalone 表示使用内置 Derby，数据落在 /home/nacos/data，由下方 PVC 持久化，
            # 否则 Pod 重启后注册中心的服务实例与配置会全部丢失
            - name: SPRING_DATASOURCE_PLATFORM
              value: "standalone"
            # JVM 堆与元空间：容器内不显式限制时，默认堆可能突破 memory limit 被 OOMKilled
            - name: JVM_XMS
              value: "1g"
            - name: JVM_XMX
              value: "1g"
            - name: JVM_XMN
              value: "512m"
            - name: JVM_MS
              value: "128m"
            - name: JVM_MMS
              value: "320m"
            # 开启鉴权：默认镜像无鉴权，任何 Pod 都能读写注册中心
            # 客户端需带凭据访问（Dubbo 注册中心地址已内置 username/password）
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mao-ai-code-secret
                  key: NACOS_AUTH_TOKEN
            - name: NACOS_AUTH_IDENTITY_KEY
              value: "serverIdentity"
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: "security"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: mao-ai-code-config
                  key: TZ
          # 就绪探针：Nacos 完成初始化后才接入流量，避免上游服务注册失败
          readinessProbe:
            httpGet:
              path: /nacos/actuator/health/readiness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          # 存活探针：进程假死时自动重启
          livenessProbe:
            httpGet:
              path: /nacos/actuator/health/liveness
              port: 8848
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /home/nacos/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nacos-data
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: yu-ai-code
  labels:
    app: nacos
spec:
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
    - name: grpc
      port: 9848
      targetPort: 9848
    - name: grpc2
      port: 9849
      targetPort: 9849
  type: ClusterIP
