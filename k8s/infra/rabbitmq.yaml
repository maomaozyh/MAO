apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: yu-ai-code
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: mao-ai-code-mother
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: yu-ai-code
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: mao-ai-code-mother
spec:
  replicas: 1
  # 单实例 + 独占 PVC（ReadWriteOnce），必须 Recreate，否则滚动更新会有第二个 Pod 抢挂载失败
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: rabbitmq
          # 固定版本，避免浮动 tag 导致意外升级
          image: rabbitmq:3.13.7-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: mao-ai-code-secret
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: mao-ai-code-secret
                  key: RABBITMQ_PASSWORD
            # 内存高水位：达到上限 60% 时阻塞生产者，避免被 OOMKilled 造成消息丢失
            - name: RABBITMQ_VM_MEMORY_HIGH_WATERMARK
              value: "0.6"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: mao-ai-code-config
                  key: TZ
          # 就绪探针：能响应 ping 才接入流量，避免服务连上未就绪的 broker
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          # 存活探针：broker 内部状态异常（如 mnesia 故障）时自动重启
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "status"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: yu-ai-code
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP
