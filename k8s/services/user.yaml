apiVersion: apps/v1
kind: Deployment
metadata:
  name: mao-ai-code-user
  namespace: yu-ai-code
  labels:
    app: mao-ai-code-user
    app.kubernetes.io/part-of: mao-ai-code-mother
spec:
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mao-ai-code-user
  template:
    metadata:
      labels:
        app: mao-ai-code-user
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mysql 3306; do echo "waiting for mysql..."; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "waiting for redis..."; sleep 2; done']
        - name: wait-for-nacos
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nacos 8848; do echo "waiting for nacos..."; sleep 2; done']
      containers:
        - name: mao-ai-code-user
          image: yu-ai-code/user:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8124
          envFrom:
            - configMapRef:
                name: mao-ai-code-config
            - secretRef:
                name: mao-ai-code-secret
          startupProbe:
            tcpSocket:
              port: 8124
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8124
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8124
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 10']
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: mao-ai-code-user
  namespace: yu-ai-code
  labels:
    app: mao-ai-code-user
spec:
  selector:
    app: mao-ai-code-user
  ports:
    - port: 8124
      targetPort: 8124
  type: ClusterIP
