apiVersion: v1
kind: ConfigMap
metadata:
  name: mao-ai-code-config
  namespace: yu-ai-code
  labels:
    app.kubernetes.io/part-of: mao-ai-code-mother
data:
  # MySQL
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "yu_ai_code_mother"
  MYSQL_USERNAME: "root"
  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  # Nacos (Dubbo 注册中心)
  NACOS_HOST: "nacos"
  NACOS_PORT: "8848"
  # Nacos 作为 Dubbo 注册中心，开启鉴权后必须带凭据访问（此处为默认账号，生产请修改）
  DUBBO_REGISTRY_ADDRESS: "nacos://nacos:8848?username=nacos&password=nacos"
  # RabbitMQ（仅非敏感配置，用户名/密码统一放在 mao-ai-code-secret，避免凭据分散）
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VIRTUAL_HOST: "/"
  # Milvus (可选，未部署时本地回退)
  MILVUS_HOST: "milvus"
  MILVUS_PORT: "19530"
  # 应用内部调用地址（网关路由 / 部署域名）
  CODE_DEPLOY_HOST: "http://mao-ai-code-gateway:8123/api"
  USER_SERVICE_URI: "http://mao-ai-code-user:8124"
  APP_SERVICE_URI: "http://mao-ai-code-app:8125"
  # 支付渠道：MOCK（沙箱） / REAL（真实支付 API）
  PAYMENT_CHANNEL: "MOCK"
  # 通用时区
  TZ: "Asia/Shanghai"
---
apiVersion: v1
kind: Secret
metadata:
  name: mao-ai-code-secret
  namespace: yu-ai-code
  labels:
    app.kubernetes.io/part-of: mao-ai-code-mother
type: Opaque
stringData:
  MYSQL_PASSWORD: "123456"
  REDIS_PASSWORD: ""
  RABBITMQ_USERNAME: "guest"
  RABBITMQ_PASSWORD: "guest"
  # Nacos 鉴权密钥：必须 Base64 编码且解码后不少于 32 字节（Nacos 2.x 强校验）
  # 当前为示例值，生产环境务必替换为自建随机密钥
  NACOS_AUTH_TOKEN: "WXVBaUNvZGVNb3RoZXJOYWNvc0F1dGhUb2tlblNlY3JldEtleTIwMjY="
