# 线上配置文件模板
# 使用方式：复制为 application-prod.yml，填入真实值或通过环境变量注入
# @author <a href="https://github.com/liyupi">程序员mao</a>
# @from <a href="https://codefather.cn">编程导航</a>
spring:
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/yu_ai_code_mother}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # HikariCP 连接池调优
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
      idle-timeout: 600000
      leak-detection-threshold: 60000
  # redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}
      ttl: 3600
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
# CORS 跨域白名单（生产环境必须配置，多个域名用逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yourdomain.com,https://www.yourdomain.com}
  allow-all: false
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_CHAT_API_KEY:}
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: ${AI_STREAM_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_STREAM_API_KEY:}
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: false
      log-responses: false
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: ${AI_REASONING_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_REASONING_API_KEY:}
      model-name: deepseek-chat
      max-tokens: 8192
      temperature: 0.1
      log-requests: false
      log-responses: false
    # 智能路由 AI 模型配置
    routing-chat-model:
      base-url: ${AI_ROUTING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_ROUTING_API_KEY:}
      model-name: qwen-turbo
      max-tokens: 100
      log-requests: false
      log-responses: false
# COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:}
# 阿里云 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  image-model: wan2.2-t2i-flash
# Pexels 图片搜索配置
pexels:
  api-key: ${PEXELS_API_KEY:}
# 短信验证码登录配置
sms:
  enabled: ${SMS_ENABLED:false}
# 微信扫码登录（开放平台 OAuth2）配置
oauth:
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    redirect-uri: ${WECHAT_REDIRECT_URI:}
# 生产环境关闭日志
mybatis-flex:
  configuration:
    log-impl: ''
# 接口文档配置（生产环境开启基础认证）
knife4j:
  basic:
    enable: true
    username: ${KNIFE4J_USERNAME:admin}
    password: ${KNIFE4J_PASSWORD:}
# 部署路径
code:
  deploy-host: ${DEPLOY_HOST:http://localhost/dist}
